name: gic  
description: "Gofa Industrial College Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- Firebase & Database ---
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.5.3

  # --- Maps & Location ---
  google_maps_flutter: ^2.5.3
  google_maps_flutter_web: ^0.5.4+2
  geolocator: ^13.0.2 
  
  # --- Data, Excel & Charts ---
  csv: ^6.0.0 
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: any
  excel: ^4.0.2
  file_saver: ^0.2.10 # <--- ADD THIS LINE HERE
  universal_html: ^2.2.4
  intl: ^0.19.0

  # --- Device Features & UI ---
  url_launcher: ^6.3.2
  image_picker: ^1.0.4
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  http: ^1.1.0

  # --- PDF & File Management ---
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/gofa_logo.png"
  web:
    generate: true
    image_path: "assets/images/gofa_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/gofa_logo.png